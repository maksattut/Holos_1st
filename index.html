<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>90s NIGHT — VHS MIX</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; color:#fff; font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at 50% 20%,rgba(255,0,190,.22),transparent 32%),
    radial-gradient(circle at 20% 80%,rgba(0,220,255,.16),transparent 30%),
    #09000f;
  overflow-x:hidden;
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:20;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 4px);
  mix-blend-mode:screen;
}
.wrap{width:min(1180px,94%);margin:auto;padding:28px 0 50px}
header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:22px}
.logo{font-size:clamp(28px,5vw,58px);font-weight:900;letter-spacing:5px;text-shadow:4px 4px #ff00a8,-2px -2px #00eaff}
.badge{font-family:monospace;border:2px solid #00eaff;padding:8px 12px;color:#00eaff;box-shadow:0 0 16px #00eaff66}
.grid{display:grid;grid-template-columns:390px 1fr;gap:22px}
.panel{
  background:linear-gradient(145deg,#190021dd,#080010e8);
  border:2px solid #ff00b7;border-radius:16px;padding:18px;
  box-shadow:0 0 35px #ff00a833,inset 0 0 25px #00eaff11;
}
.cover{
  width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px;
  border:3px solid #00eaff;box-shadow:0 0 25px #00eaff55;
}
.now{margin-top:14px}
.kicker{font:700 12px monospace;color:#00eaff;letter-spacing:3px}
.title{font-size:25px;font-weight:900;margin:5px 0}
.artist{color:#ff7bd6}
.deck{
  margin-top:16px;background:#151515;border:4px solid #555;border-radius:10px;padding:15px;
  box-shadow:inset 0 0 0 3px #222,0 8px 25px #000;
}
.cassette{height:120px;position:relative;background:linear-gradient(#272727,#111);border:2px solid #777;border-radius:7px;overflow:hidden}
.cassette:after{content:"";position:absolute;left:50%;top:50%;width:155px;height:48px;transform:translate(-50%,-50%);
background:#111;border:2px solid #777;clip-path:polygon(8% 0,92% 0,100% 100%,0 100%)}
.reel{position:absolute;top:28px;width:62px;height:62px;border-radius:50%;background:repeating-conic-gradient(#ddd 0 8deg,#555 8deg 16deg);border:7px solid #999;z-index:2}
.reel:after{content:"";position:absolute;inset:20px;border-radius:50%;background:#111;border:3px solid #aaa}
.r1{left:45px}.r2{right:45px}
.playing .reel{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.lcd{margin-top:12px;background:#09100a;color:#62ff62;border:3px solid #444;padding:10px 12px;font:700 17px monospace;box-shadow:inset 0 0 14px #62ff6233;display:flex;justify-content:space-between;gap:10px}
.eq{height:80px;display:flex;align-items:end;justify-content:center;gap:4px;margin:12px 0}
.eq i{display:block;width:7px;background:#00eaff;height:15%;box-shadow:0 0 8px #00eaff;animation:none}
.playing .eq i{animation:eq .55s infinite ease-in-out alternate}
.eq i:nth-child(2n){animation-delay:.12s}.eq i:nth-child(3n){animation-delay:.24s}.eq i:nth-child(4n){animation-delay:.36s}
@keyframes eq{to{height:90%}}
.controls{display:flex;gap:8px;justify-content:center}
button{
  border:2px solid #00eaff;background:#0b0b13;color:#fff;padding:11px 14px;border-radius:7px;
  font-weight:900;cursor:pointer;box-shadow:0 0 12px #00eaff22
}
button:hover{background:#00eaff;color:#08000f}
.mainplay{border-color:#ff00b7;background:#ff00b7;color:#fff;font-size:16px}
.mainplay:hover{background:#fff;color:#ff00b7}
input[type=range]{width:100%;accent-color:#ff00b7}
.bar{display:flex;gap:10px;align-items:center;margin-top:10px;font:12px monospace;color:#bbb}
.bar span{min-width:42px}
.search{display:flex;gap:10px;margin-bottom:14px}
.search input{
  flex:1;padding:13px;background:#07070b;border:2px solid #6c2b72;color:white;border-radius:7px;outline:none
}
.playlist{max-height:610px;overflow:auto;padding-right:5px}
.track{
  display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;
  padding:11px;border:1px solid #3b2141;margin-bottom:7px;border-radius:8px;background:#0d0712;cursor:pointer
}
.track:hover,.track.active{border-color:#00eaff;background:#111525;box-shadow:0 0 14px #00eaff22}
.num{font:700 14px monospace;color:#ff00b7;text-align:center}
.tname{font-weight:900}.tartist{font-size:12px;color:#aaa;margin-top:3px}
.file{font:11px monospace;color:#62ff62}
.hint{margin-top:12px;padding:12px;border-left:3px solid #ff00b7;background:#160719;color:#ddd;font-size:13px;line-height:1.5}
.tv{position:fixed;inset:0;pointer-events:none;opacity:0;z-index:30;background:repeating-linear-gradient(0deg,transparent 0 3px,#fff1 3px 4px)}
body:hover .tv{animation:tv .35s steps(2) infinite}
@keyframes tv{0%,100%{opacity:.04}50%{opacity:.12}}
@media(max-width:850px){.grid{grid-template-columns:1fr}.panel:first-child{max-width:560px;margin:auto}.playlist{max-height:500px}}
</style>
</head>
<body>
<div class="tv"></div>
<div class="wrap">
<header>
  <div class="logo">90s NIGHT</div>
  <div class="badge">VHS MIX • LOCAL PLAYER</div>
</header>

<div class="grid">
<section class="panel">
  <img class="cover" src="assets/cover.png" alt="90s Night cover">
  <div class="now">
    <div class="kicker">NOW PLAYING</div>
    <div id="title" class="title">Выберите трек</div>
    <div id="artist" class="artist">90s NIGHT</div>
  </div>

  <div id="deck" class="deck">
    <div class="cassette">
      <div class="reel r1"></div><div class="reel r2"></div>
    </div>
    <div class="lcd"><span id="lcdTitle">READY</span><span id="lcdTime">00:00</span></div>
    <div class="eq" id="eq"></div>
    <div class="controls">
      <button onclick="prev()">⏮</button>
      <button class="mainplay" onclick="toggle()">▶ PLAY</button>
      <button onclick="next()">⏭</button>
    </div>
    <div class="bar"><span id="cur">00:00</span><input id="progress" type="range" min="0" max="100" value="0"><span id="dur">00:00</span></div>
    <div class="bar"><span>VOL</span><input id="volume" type="range" min="0" max="1" step=".01" value=".8"></div>
  </div>

  <div class="hint">
    🎵 <b>Музыка хранится прямо в проекте.</b><br>
    Положите свои MP3 в папку <code>music/</code> и укажите их имена в списке ниже.
    Никаких API, Deezer, iTunes или CORS — браузер проигрывает ваши файлы напрямую с GitHub Pages.
  </div>
</section>

<section class="panel">
  <div class="search"><input id="search" placeholder="Поиск по кассетам..." oninput="render()"></div>
  <div id="playlist" class="playlist"></div>
</section>
</div>
</div>

<audio id="audio" preload="metadata"></audio>

<script>
/*
  ==========================================================
  ДОБАВЛЕНИЕ СВОИХ ТРЕКОВ
  ==========================================================
  1. Положите MP3-файлы в папку music/
  2. Добавьте строки в массив tracks:
     { title: "Название", artist: "Исполнитель", file: "music/file.mp3" }

  ВАЖНО: имя файла должно совпадать ТОЧНО.
*/
const tracks = [
  {title:"What Is Love", artist:"Haddaway", file:"music/haddaway-what-is-love.mp3"},
  {title:"Rhythm Is a Dancer", artist:"Snap!", file:"music/snap-rhythm-is-a-dancer.mp3"},
  {title:"It's My Life", artist:"Dr. Alban", file:"music/dr-alban-its-my-life.mp3"},
  {title:"No Limit", artist:"2 Unlimited", file:"music/2-unlimited-no-limit.mp3"},
  {title:"The Rhythm of the Night", artist:"Corona", file:"music/corona-rhythm-of-the-night.mp3"},
  {title:"All That She Wants", artist:"Ace of Base", file:"music/ace-of-base-all-that-she-wants.mp3"},
  {title:"Set the World on Fire", artist:"E-Type", file:"music/e-type-set-the-world-on-fire.mp3"},
  {title:"Everybody (Backstreet's Back)", artist:"Backstreet Boys", file:"music/backstreet-boys-everybody.mp3"},
  {title:"Smells Like Teen Spirit", artist:"Nirvana", file:"music/nirvana-smells-like-teen-spirit.mp3"},
  {title:"Blue (Da Ba Dee)", artist:"Eiffel 65", file:"music/eiffel-65-blue.mp3"}
];

let index = 0;
const audio = document.getElementById("audio");
const deck = document.getElementById("deck");
const progress = document.getElementById("progress");
const volume = document.getElementById("volume");
const eq = document.getElementById("eq");

for(let i=0;i<24;i++){ const b=document.createElement("i"); eq.appendChild(b); }

function fmt(sec){
  if(!isFinite(sec)) return "00:00";
  sec=Math.max(0,Math.floor(sec));
  return String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0");
}
function render(){
  const q=document.getElementById("search").value.toLowerCase();
  const box=document.getElementById("playlist");
  box.innerHTML="";
  tracks.forEach((t,i)=>{
    if((t.title+" "+t.artist).toLowerCase().includes(q)){
      const el=document.createElement("div");
      el.className="track"+(i===index?" active":"");
      el.innerHTML=`<div class="num">${String(i+1).padStart(2,"0")}</div>
        <div><div class="tname">${escapeHtml(t.title)}</div><div class="tartist">${escapeHtml(t.artist)}</div></div>
        <div class="file">MP3</div>`;
      el.onclick=()=>load(i,true);
      box.appendChild(el);
    }
  });
}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));}
function load(i,autoplay=false){
  index=(i+tracks.length)%tracks.length;
  const t=tracks[index];
  document.getElementById("title").textContent=t.title;
  document.getElementById("artist").textContent=t.artist;
  document.getElementById("lcdTitle").textContent=t.title.toUpperCase();
  document.getElementById("lcdTime").textContent="00:00";
  audio.src=t.file;
  progress.value=0;
  render();
  if(autoplay){
    audio.play().then(()=>deck.classList.add("playing")).catch(()=>{
      deck.classList.remove("playing");
      alert("Не удалось открыть файл:\\n"+t.file+"\\n\\nПроверьте, что MP3 лежит в папке music/ и имя файла совпадает.");
    });
  }
}
function toggle(){
  if(!audio.src) load(0,false);
  if(audio.paused){
    audio.play().then(()=>deck.classList.add("playing")).catch(()=>{
      alert("Сначала загрузите MP3 в папку music/ и проверьте имя файла в массиве tracks.");
    });
  }else{
    audio.pause(); deck.classList.remove("playing");
  }
}
function next(){load(index+1,true)}
function prev(){load(index-1,true)}
audio.addEventListener("loadedmetadata",()=>{document.getElementById("dur").textContent=fmt(audio.duration)});
audio.addEventListener("timeupdate",()=>{
  const p=audio.duration?(audio.currentTime/audio.duration)*100:0;
  progress.value=p;
  document.getElementById("cur").textContent=fmt(audio.currentTime);
  document.getElementById("lcdTime").textContent=fmt(audio.currentTime);
});
audio.addEventListener("ended",next);
audio.addEventListener("play",()=>deck.classList.add("playing"));
audio.addEventListener("pause",()=>deck.classList.remove("playing"));
audio.addEventListener("error",()=>{
  deck.classList.remove("playing");
  if(audio.src) document.getElementById("lcdTitle").textContent="FILE ERROR";
});
progress.addEventListener("input",()=>{
  if(audio.duration) audio.currentTime=(progress.value/100)*audio.duration;
});
volume.addEventListener("input",()=>audio.volume=volume.value);
audio.volume=volume.value;
load(0,false);
render();
</script>
</body>
</html>
